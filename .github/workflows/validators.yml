name: validators

on:
  pull_request:
  push:
    branches: [master]

# Forks keep these steps and add their initialization checks (TASK-015):
# validate_discovery.py docs/PRODUCT.md, validate_config.py check, and
# validate_config.py render --verify.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (README prerequisites) and the latest.
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Run the documented commands with the matrix interpreter.
      - run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Validate the bundled discovery sample
        run: python skills/sdd-init/scripts/validate_discovery.py skills/sdd-init/examples/sample-discovery-output.md
      - name: Run validator regression tests
        run: uv run --no-project --with-requirements skills/sdd-init/scripts/requirements.txt python -m unittest discover -s tests -v
