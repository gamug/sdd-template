name: validators

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    # 22.04 still provides Python 3.8, the oldest supported version.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pyyaml
      - name: Validate the bundled discovery sample
        run: python skills/tech-use-case-discovery/scripts/validate_discovery.py skills/tech-use-case-discovery/examples/sample-discovery-output.md
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
